<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SecuStack Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width: 320px; padding: 15px; margin: 0; background-color: #f8f9fa; color: #333; }
        h2 { font-size: 16px; border-bottom: 2px solid #007bff; padding-bottom: 5px; color: #007bff; margin-top: 0; }
        h3 { font-size: 14px; margin-top: 15px; margin-bottom: 5px; color: #555; }
        p { font-size: 13px; margin: 4px 0; padding: 6px; background: #fff; border: 1px solid #ddd; border-radius: 4px; }
        strong { color: #222; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; float: right; }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h2>🛡️ SecuStack Analyzer</h2>
    <div id="results">
        <p>Scanning current page...</p>
    </div>
    <script src="popup.js"></script>
</body>
</html>
